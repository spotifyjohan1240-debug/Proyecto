<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous" />

    <title>Panel Central</title>
</head>

<body style="background-color: #f4f5f7;">
    <div class="container min-vh-100 py-4 d-flex flex-column justify-content-center">

        <!-- Botón de Cerrar Sesión Arriba -->
        <div class="d-flex justify-content-end mb-4">
            <a href="../index.html" class="btn btn-outline-danger font-weight-bold">
                Cerrar Sesión
            </a>
        </div>

        <!-- FILA SUPERIOR (3 tarjetas) -->
        <div class="row justify-content-center mb-4">

            <!-- Card 1: Registrar Venta -->
            <div class="col-12 col-md-4 mb-3 mb-md-0">
                <a href="RegistrarVenta.html" class="text-decoration-none">
                    <div class="card shadow-sm border-0 p-4 rounded-lg text-center h-100"
                        style="background-color: rgba(200, 225, 255, 0.85);">
                        <div class="display-4 mb-2">🛒</div>
                        <h4 class="font-weight-bold text-dark m-0">Registrar Venta</h4>
                    </div>
                </a>
            </div>

            <!-- Card 2: Consulta de Precios -->
            <div class="col-12 col-md-4 mb-3 mb-md-0">
                <a href="ConsultaPrecios.html" class="text-decoration-none">
                    <div class="card shadow-sm border-0 p-4 rounded-lg text-center h-100"
                        style="background-color: rgba(210, 240, 215, 0.85);">
                        <div class="display-4 mb-2">🏷️</div>
                        <h4 class="font-weight-bold text-dark m-0">Consulta de Precios</h4>
                    </div>
                </a>
            </div>

            <!-- Card 3: Consultar Inventario -->
            <div class="col-12 col-md-4">
                <a href="ConsultarInventario.html" class="text-decoration-none">
                    <div class="card shadow-sm border-0 p-4 rounded-lg text-center h-100"
                        style="background-color: rgba(255, 235, 195, 0.85);">
                        <div class="display-4 mb-2">📦</div>
                        <h4 class="font-weight-bold text-dark m-0">Consultar Inventario</h4>
                    </div>
                </a>
            </div>

        </div>

        <!-- FILA INFERIOR (3 tarjetas) -->
        <div class="row justify-content-center">

            <!-- Card 4: Cambios -->
            <div class="col-12 col-md-4 mb-3 mb-md-0">
                <a href="Cambios.html" class="text-decoration-none">
                    <div class="card shadow-sm border-0 p-4 rounded-lg text-center h-100"
                        style="background-color: rgba(225, 210, 250, 0.85);">
                        <div class="display-4 mb-2">🔄</div>
                        <h4 class="font-weight-bold text-dark m-0">Cambios</h4>
                    </div>
                </a>
            </div>

            <!-- Card 5: Devoluciones (Melocotón / Naranja suave único) -->
            <div class="col-12 col-md-4 mb-3 mb-md-0">
                <a href="Devoluciones.html" class="text-decoration-none">
                    <div class="card shadow-sm border-0 p-4 rounded-lg text-center h-100"
                        style="background-color: rgba(255, 205, 175, 0.85);">
                        <div class="display-4 mb-2">↩️</div>
                        <h4 class="font-weight-bold text-dark m-0">Devoluciones</h4>
                    </div>
                </a>
            </div>

            <!-- Card 6: Plan Separe -->
            <div class="col-12 col-md-4">
                <a href="PlanSepare.html" class="text-decoration-none">
                    <div class="card shadow-sm border-0 p-4 rounded-lg text-center h-100"
                        style="background-color: rgba(255, 215, 220, 0.85);">
                        <div class="display-4 mb-2">📝</div>
                        <h4 class="font-weight-bold text-dark m-0">Plan Separe</h4>
                    </div>
                </a>
            </div>

        </div>

    </div>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
        crossorigin="anonymous"></script>
</body>

</html>
