<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous" />

    <title>Consulta Rápida de Precios - POS</title>
</head>

<body style="background-color: #f4f5f7;">
    <div class="container-fluid min-vh-100 p-3 p-md-4 d-flex flex-column">

        <!-- Barra superior de navegación -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="h4 font-weight-bold text-dark m-0">Consulta Rápida de Precios</h3>
            <a href="PanelCentralVendedor.html" class="btn btn-outline-secondary font-weight-bold">
                ← Volver al Panel
            </a>
        </div>

        <!-- Contenido Principal: Pantalla Dividida -->
        <div class="row flex-fill">

            <!-- PANEL IZQUIERDO: Transmisión de Cámara en Vivo -->
            <div class="col-12 col-lg-5 mb-4 mb-lg-0 d-flex flex-column">
                <div class="card shadow-sm border-0 flex-fill d-flex flex-column justify-content-between p-3">
                    <div>
                        <h5 class="card-title font-weight-bold text-center text-muted mb-3">
                            Escáner de Consulta
                        </h5>

                        <!-- Visor de la Cámara -->
                        <div
                            class="embed-responsive embed-responsive-4by3 bg-dark rounded overflow-hidden shadow-inner">
                            <video id="webcam" class="embed-responsive-item" autoplay playsinline muted
                                style="object-fit: cover;"></video>
                        </div>
                        <small class="text-muted text-center d-block mt-2">
                            Ubique el producto frente a la cámara.
                        </small>
                    </div>

                    <!-- Botón para consultar el siguiente producto -->
                    <div class="mt-3">
                        <button id="btnConsultar"
                            class="btn btn-info btn-lg btn-block font-weight-bold shadow-sm text-white">
                            Escanear otro producto
                        </button>
                    </div>
                </div>
            </div>

            <!-- PANEL DERECHO: Visualización del Precio -->
            <div class="col-12 col-lg-7 d-flex flex-column">
                <div class="card shadow-sm border-0 flex-fill d-flex flex-column justify-content-center p-4">

                    <h5 class="card-title font-weight-bold text-dark mb-4 text-center">
                        Información del Artículo
                    </h5>

                    <!-- Tarjeta interna con el resultado del precio -->
                    <div class="text-center bg-white p-5 rounded shadow-sm border">

                        <!-- Nombre del Producto -->
                        <h2 id="nombreProducto" class="font-weight-bold text-dark mb-2">
                            Camiseta Casual Azul
                        </h2>

                        <!-- Código de Referencia -->
                        <p class="text-muted mb-4" style="font-size: 1.1rem;">
                            Código de Referencia: <span id="codigoProducto"
                                class="font-weight-bold text-secondary">77012345</span>
                        </p>

                        <hr class="w-50 my-4">

                        <!-- Precio Grande y Destacado -->
                        <span class="d-block text-muted text-uppercase small font-weight-bold mb-1">Precio de Venta al
                            Público</span>
                        <h1 id="precioProducto" class="display-3 font-weight-bold text-success mb-0">
                            $45.000
                        </h1>

                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- Scripts de Bootstrap y Lógica interactiva de simulación -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
        crossorigin="anonymous"></script>

    <script>
        // 1. Inicialización de la Cámara Web en tiempo real
        const video = document.getElementById('webcam');
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => { video.srcObject = stream; })
                .catch(err => { console.log("La cámara no se pudo activar o no hay permiso: ", err); });
        }

        // 2. Misma base de productos ficticios utilizada en el módulo de ventas
        const basePrecios = [
            { nombre: "Zapatos Deportivos Negros", cod: "77098765", precio: 120000 },
            { nombre: "Jean Clásico Azul", cod: "77045612", precio: 85000 },
            { nombre: "Chaqueta Impermeable", cod: "77032165", precio: 150000 },
            { nombre: "Camiseta Casual Azul", cod: "77012345", precio: 45000 }
        ];
        let indiceConsulta = 0;

        // 3. Cambiar inmediatamente la información al hacer clic en "Escanear otro producto"
        $('#btnConsultar').click(function () {
            const producto = basePrecios[indiceConsulta];

            // Actualizar datos en pantalla
            $('#nombreProducto').text(producto.nombre);
            $('#codigoProducto').text(producto.cod);
            $('#precioProducto').text('$' + producto.precio.toLocaleString('es-CO'));

            // Pasar al siguiente producto para la próxima consulta
            indiceConsulta = (indiceConsulta + 1) % basePrecios.length;
        });
    </script>
</body>

</html>
